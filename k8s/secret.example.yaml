# ORNEK — bu dosya oldugu gibi UYGULANMAZ.
#
# Degerler kasten bos. Doldurulmus halini repoya KOYMAYIN; .gitignore
# k8s/secret.yaml'i dislar, dosyayi o adla kopyalayip doldurun.
#
# Tercih edilen yol, dosya yerine .env'den okuyan bir komut. Degerler
# kabuk gecmisine ve bu dosyaya hic girmez:
#
#   set -a; . ./.env; set +a
#   kubectl -n derivex create secret generic derivex-secrets \
#     --from-env-file=.env
#
# Tek tek vermek gerekirse yine degisken uzerinden, duz metinle degil:
#
#   kubectl -n derivex create secret generic derivex-secrets \
#     --from-literal=STREAM_USERNAME="$STREAM_USERNAME" \
#     --from-literal=API_KEYS="$API_KEYS"
#
# Anahtar ve oturum sirri uretmek icin:  node auth.js --generate
#
# NOT: Kubernetes Secret varsayilan olarak base64'tur, SIFRELI DEGILDIR.
# etcd'de duz metne esdeger durur. Gercek gizlilik icin kumede
# encryption-at-rest acik olmali ya da harici bir sir deposu
# (External Secrets, Vault) kullanilmali. Bunu soylemek gerekiyor cunku
# "Secret" adi yanlis bir guven veriyor.
apiVersion: v1
kind: Secret
metadata:
  name: derivex-secrets
  namespace: derivex
type: Opaque
stringData:
  # IdealData akis kimlik bilgileri. Bos ise canli mod baglanamaz;
  # DATA_MODE=0 (mock) ile calismaya devam eder.
  STREAM_USERNAME: ""
  STREAM_PASSWORD: ""
  IDEALDATA_API_KEY: ""

  # API erisim anahtarlari: "ad:anahtar,ad2:anahtar2"
  #
  # BOS BIRAKILIRSA KIMLIK DOGRULAMA KAPALIDIR. Gelistirmede kolaylik
  # olsun diye boyle, ama kumede bos birakmak panoyu ve tum API'yi
  # acik birakmak demektir.
  API_KEYS: ""

  # Cerez imzalama sirri. Verilmezse her pod baslangicinda uretilir;
  # pod yeniden basladiginda tum oturumlar duser. Tek replikada
  # katlanilabilir ama gereksiz: bir kez uretip buraya koyun.
  SESSION_SECRET: ""

  # TLS. Kumede TLS'i genelde Ingress bitirir ve bu ikisi gereksizdir.
  # Pod'un kendisinin HTTPS konusmasi isteniyorsa sertifika ve anahtar
  # buraya konup deployment'ta birim olarak baglanir.
  # TLS_CERT: ""
  # TLS_KEY: ""
